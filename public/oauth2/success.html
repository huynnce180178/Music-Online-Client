<body>
  <div
    id="loading"
    style="text-align: center; margin-top: 40px; font-size: 20px"
  >
  </div>
  <script>
    window.onload = function () {
      if (window.location.hash === '#_=_') {
        window.history.replaceState(null, null, window.location.pathname + window.location.search);
      }
      
      const currentUrl = new URL(window.location.href);
      const callbackUrl = new URL('/oauth/callback', window.location.origin);
      
      currentUrl.searchParams.forEach((value, key) => {
        callbackUrl.searchParams.set(key, value);
      });
      
      if (!callbackUrl.searchParams.has('provider')) {
        const urlPath = window.location.pathname;
        const searchParams = window.location.search;
        console.log('URL path:', urlPath);
        console.log('Search params:', searchParams);
        
        if (urlPath.includes('facebook') || searchParams.includes('facebook')) {
          callbackUrl.searchParams.set('provider', 'facebook');
          console.log('Setting provider to facebook');
        } else {
          callbackUrl.searchParams.set('provider', 'google');
          console.log('Setting provider to google');
        }
      }
      
      console.log('Final callback URL:', callbackUrl.toString());
      
      callbackUrl.searchParams.set('oauth2', 'true');
      
      window.location.href = callbackUrl.toString();
    };
  </script>
</body>
